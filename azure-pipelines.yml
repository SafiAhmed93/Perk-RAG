# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- umar

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Copying_the_code_to_VM
    displayName: 'Copying-the-code'
    jobs:
      - job: CopyCode
        steps:
          - checkout: self
            displayName: 'copied code'
          
          - task: CopyFilesOverSSH@0
            inputs:
              sshEndpoint: 'linux-vm'
              contents: '**'
              targetFolder: '/home/vmadmin/gim-app'
              cleanTargetFolder: True
              readyTimeout: '20000'
              
              

        
