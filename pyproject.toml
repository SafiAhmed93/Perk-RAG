[project]
name = "ragapp"
version = "0.1.0"
description = ""
authors = [
    {name = "Junaid Babar",email = "junaid@brio.co.in"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115.8,<0.116.0)",
    "azure-data-tables (>=12.6.0,<13.0.0)",
    "azure-storage-blob (>=12.24.1,<13.0.0)",
    "azure-identity (>=1.20.0,<2.0.0)",
    "azure-search-documents (>=11.5.2,<12.0.0)",
    "openai (>=1.64.0,<2.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-dependency (>=0.6.0,<0.7.0)",
    "msal (>=1.31.1,<2.0.0)",
]

[tool.poetry.scripts]
serve = "ragapp.main:main"
format = "black ."

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.9.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
