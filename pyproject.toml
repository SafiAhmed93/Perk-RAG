[tool.poetry]
name = "ragapp"
version = "0.1.0"
description = ""
authors = ["Junaid Babar <junaid@brio.co.in>"]
readme = "README.md"
packages = [{ include = "ragapp" }]
python = ">=3.11,<4.0"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.8,<0.116.0"
azure-data-tables = ">=12.6.0,<13.0.0"
azure-storage-blob = ">=12.24.1,<13.0.0"
azure-identity = ">=1.20.0,<2.0.0"
azure-search-documents = ">=11.5.2,<12.0.0"
openai = ">=1.64.0,<2.0.0"
pydantic = ">=2.10.6,<3.0.0"
uvicorn = ">=0.34.0,<0.35.0"
pytest = ">=8.3.5,<9.0.0"
pytest-dependency = ">=0.6.0,<0.7.0"
msal = ">=1.31.1,<2.0.0"
azure-storage-file-datalake = ">=12.19.0,<13.0.0"
python-dotenv = ">=1.0.1,<2.0.0"
pytz = ">=2025.1,<2026.0"
langchain = ">=0.3.20,<0.4.0"
langchain-community = ">=0.3.19,<0.4.0"
pypdf = ">=5.4.0,<6.0.0"
unstructured = { extras = ["pdf"], version = ">=0.17.0,<0.18.0" }
azure-mgmt-storage = ">=22.1.1,<23.0.0"
langchain-text-splitters = ">=0.3.6,<0.4.0"
tiktoken = ">=0.9.0,<0.10.0"
langchain-openai = ">=0.3.9,<0.4.0"
rich = ">=13.9.4,<14.0.0"
python-multipart = ">=0.0.20,<0.0.21"

[tool.poetry.scripts]
serve = "ragapp.main:main"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.9.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
