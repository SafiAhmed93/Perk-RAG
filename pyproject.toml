[project]
name = "ragapp"
version = "0.1.0"
description = ""
authors = [
    {name = "Junaid Babar",email = "junaid@brio.co.in"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi",
    "azure-data-tables",
    "azure-storage-blob",
    "azure-identity",
    "azure-search-documents",
    "openai",
    "pydantic",
    "uvicorn",
    "pytest",
    "pytest-dependency",
    "msal",
    "azure-storage-file-datalake",
    "python-dotenv",
    "langchain (>=0.3.20,<0.4.0)",
    "langchain-community (>=0.3.19,<0.4.0)",
    "pypdf (>=5.4.0,<6.0.0)",
    "azure-mgmt-storage (>=22.1.1,<23.0.0)",
    "langchain-text-splitters (>=0.3.6,<0.4.0)",
    "langchain-openai (>=0.3.9,<0.4.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "rich (>=14.0.0,<15.0.0)",
]

[tool.poetry.scripts]
serve = "ragapp.main:main"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.9.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
